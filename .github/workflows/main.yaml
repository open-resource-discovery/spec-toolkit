name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    name: Static linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Installing Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install NPM dependencies
        run: npm ci

      - name: Biome
        run: npm run biome:ci

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install NPM dependencies
        run: npm ci

      - name: Tests
        run: |
          mkdir -p reports/node-test
          npm run test:coverage -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/node-test/junit.xml

      - uses: actions/upload-artifact@v7 # upload test results
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results-node26
          path: reports/node-test/junit.xml

  build:
    name: Build job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build
        run: npm run build

  website-build:
    name: Website Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build
        run: npm run build:website

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./website/build
